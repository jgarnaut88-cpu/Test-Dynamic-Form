<!DOCTYPE html>
<!-- Digital Inspection Form — Version 7 — CAT 793F Mechanical Inspection (Doc 45-01002-CK-MN-0058 Rev 24) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CAT 793F Mechanical Inspection — Digital Checklist</title>
<style>
:root{
  --bg:#0e1116; --bg2:#151a22; --panel:#1b212b; --panel2:#222a36;
  --line:#2c3744; --line2:#3a4756;
  --txt:#e8edf2; --mut:#8a97a6; --mut2:#5e6b78;
  --steel:#cfd8e3;
  --hi:#ffb000;            /* hi-vis amber - brand-neutral industrial accent */
  --hi-d:#1f1700;
  --a:#26b265; --a-d:#0c2a18;   /* A - good */
  --b:#3d8bff; --b-d:#0d1f3a;   /* B - repaired */
  --c:#ffb000; --c-d:#2a2000;   /* C - notification */
  --n:#ff4d4d; --n-d:#2e0d0d;   /* N - out of service */
  --na:#5e6b78; --na-d:#1c232c; /* N/A */
  --ok:#26b265; --warn:#ff4d4d;
  --r:14px;
  font-size:17px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
  font-feature-settings:"tnum";overscroll-behavior:none}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;
  src:url(https://fonts.gstatic.com/s/barlow/v12/7cHpv4kjgoGqM7E_DMs5.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;
  src:url(https://fonts.gstatic.com/s/barlow/v12/7cHqv4kjgoGqM7E3t-4s51os.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:800;font-display:swap;
  src:url(https://fonts.gstatic.com/s/barlow/v12/7cHqv4kjgoGqM7E3w-0s51os.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;
  src:url(https://fonts.gstatic.com/s/barlowcondensed/v12/HTxwL3I-JCGChYJ8VI-L6OO_au7B43LT31vytleQ.woff2) format('woff2')}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#11161d,#0e1116);
  border-bottom:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.tb-main{display:flex;align-items:center;gap:14px;padding:12px 18px}
.brandmark{width:46px;height:46px;border-radius:11px;flex:0 0 auto;
  background:repeating-linear-gradient(45deg,#1c2430 0 9px,#222c3a 9px 18px);
  border:1px solid var(--line2);display:grid;place-items:center;position:relative}
.brandmark::after{content:"793F";font-family:'Barlow Condensed';font-weight:700;font-size:14px;
  letter-spacing:.5px;color:var(--hi)}
.tb-id{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.tb-id .t{font-family:'Barlow Condensed';font-weight:700;font-size:1.32rem;letter-spacing:.3px;
  text-transform:uppercase;white-space:nowrap}
.tb-id .s{font-size:.74rem;color:var(--mut);letter-spacing:.6px;text-transform:uppercase}
.tb-spacer{flex:1}
.progwrap{display:flex;align-items:center;gap:12px}
.progdial{width:54px;height:54px;flex:0 0 auto}
.progdial text{fill:var(--txt);font-size:13px;font-weight:800;font-family:'Barlow'}
.progmeta{display:flex;flex-direction:column;line-height:1.1;text-align:right}
.progmeta b{font-size:.95rem}
.progmeta span{font-size:.7rem;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}

/* interval + nav strip */
.tb-sub{display:flex;align-items:center;gap:8px;padding:0 18px 10px;flex-wrap:wrap}
.lbl{font-size:.68rem;letter-spacing:.7px;text-transform:uppercase;color:var(--mut2);margin-right:2px}
.ivl{display:flex;gap:6px;background:#0c1015;border:1px solid var(--line);border-radius:11px;padding:4px}
.ivl button{appearance:none;border:0;background:transparent;color:var(--mut);
  font-family:'Barlow';font-weight:600;font-size:.84rem;padding:8px 13px;border-radius:8px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.4px;transition:.15s}
.ivl button.on{background:var(--hi);color:#1a1300;box-shadow:0 2px 8px rgba(255,176,0,.3)}
.navchips{display:flex;gap:7px;overflow-x:auto;padding:0 18px 12px;-webkit-overflow-scrolling:touch}
.navchips::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:.8rem;color:var(--steel);cursor:pointer;display:flex;align-items:center;gap:7px;
  white-space:nowrap;transition:.15s}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--mut2)}
.chip.done .dot{background:var(--ok)}
.chip.skip{opacity:.42}
.chip:active{transform:scale(.96)}

/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:18px 18px 160px}
.section{margin-top:26px;scroll-margin-top:148px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sec-bar{width:5px;align-self:stretch;border-radius:3px;background:var(--hi)}
.sec-head h2{margin:0;font-family:'Barlow Condensed';font-weight:700;font-size:1.32rem;
  text-transform:uppercase;letter-spacing:.4px}
.sec-tag{font-size:.66rem;letter-spacing:.6px;text-transform:uppercase;color:var(--mut2);
  border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.section.skip{opacity:.5}
.skip-note{background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r);
  padding:16px 18px;color:var(--mut);font-size:.9rem}

.group-label{margin:18px 0 8px;font-family:'Barlow Condensed';font-weight:700;
  font-size:.95rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--hi);
  display:flex;align-items:center;gap:10px}
.group-label::before{content:"";width:18px;height:2px;background:var(--hi)}

/* safety precautions */
.safetycard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:0;overflow:hidden;border-top:3px solid var(--hi)}
.safehead{display:flex;align-items:center;gap:12px;padding:15px 16px;background:#1a1f28}
.safehead svg{flex:0 0 auto}
.safehead h3{margin:0;font-family:'Barlow Condensed';font-weight:700;font-size:1.25rem;
  text-transform:uppercase;letter-spacing:.4px}
.safehead .sub{font-size:.72rem;color:var(--mut);letter-spacing:.4px}
.safelist{padding:8px 16px 4px}
.safeitem{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.safeitem:last-child{border-bottom:0}
.safeitem .tag{flex:0 0 auto;font-family:'Barlow Condensed';font-weight:700;font-size:.78rem;
  letter-spacing:.5px;text-transform:uppercase;color:var(--hi);background:var(--hi-d);
  border:1px solid #4a3a00;border-radius:6px;padding:3px 9px;height:fit-content;min-width:78px;text-align:center}
.safeitem p{margin:0;font-size:.9rem;line-height:1.45;color:var(--steel)}
.safeitem p b{color:var(--txt)}
.ackzone{background:#0c1015;border-top:1px solid var(--line);padding:16px}
.acklabel{font-size:.72rem;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin:0 0 9px}
.chkrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chkchip{display:inline-flex;align-items:center;gap:9px;min-height:48px;padding:0 15px;border-radius:11px;
  border:1.5px solid var(--line2);background:#11161d;color:var(--steel);font-family:inherit;
  font-weight:600;font-size:.9rem;cursor:pointer;transition:.12s}
.chkchip .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--mut2);display:grid;place-items:center;flex:0 0 auto}
.chkchip.on{background:var(--b-d);border-color:var(--b);color:#cfe2ff}
.chkchip.on .bx{background:var(--b);border-color:var(--b)}
.chkchip.on .bx::after{content:"\2713";color:#06122a;font-size:.8rem;font-weight:800}
.chkchip:active{transform:scale(.96)}
.tcgate{display:flex;align-items:center;gap:13px;min-height:58px;padding:0 16px;border-radius:12px;
  border:1.5px solid var(--c);background:var(--c-d);color:#ffd27a;font-family:inherit;font-weight:700;
  font-size:1rem;cursor:pointer;width:100%;text-align:left}
.tcgate .bx{width:26px;height:26px;border-radius:7px;border:2px solid var(--c);display:grid;place-items:center;flex:0 0 auto}
.tcgate.on{border-color:var(--a);background:var(--a-d);color:var(--a)}
.tcgate.on .bx{background:var(--a);border-color:var(--a)}
.tcgate.on .bx::after{content:"\2713";color:#06140c;font-size:.95rem;font-weight:800}
.ra-note{display:flex;gap:10px;align-items:flex-start;background:var(--hi-d);border:1px solid #4a3a00;
  border-radius:10px;padding:11px 13px;margin-bottom:14px;font-size:.84rem;line-height:1.45;color:#ffd9a0}
.ra-note svg{flex:0 0 auto;margin-top:1px}
.tcgate.optional{border-style:dashed;border-color:var(--line2);background:#0c1015;color:var(--steel)}
.tcgate.optional.on{border-style:solid;border-color:var(--c);background:var(--c-d);color:var(--c)}
.tcgate.optional.on .bx{background:var(--c);border-color:var(--c)}
.tcgate.optional.on .bx::after{color:#2a2000}
.tcgate .opttag{margin-left:auto;font-size:.62rem;letter-spacing:.5px;text-transform:uppercase;
  color:var(--mut2);background:#11161d;border:1px solid var(--line2);border-radius:6px;padding:2px 7px}
.otherin{margin-top:-6px;margin-bottom:14px}
.otherin input{width:100%;max-width:340px;background:#11161d;border:1px solid var(--line2);color:var(--txt);
  border-radius:10px;padding:11px 12px;font-family:inherit;font-size:.92rem;min-height:46px}

/* meta panel */
.metacard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 6px}
.toolcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;margin-top:14px}
.toolhead{display:flex;align-items:center;gap:9px;margin-bottom:11px;font-family:'Barlow Condensed';
  font-weight:700;font-size:1rem;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.toolchips{display:flex;gap:8px;flex-wrap:wrap}
.toolchip{background:#0c1015;border:1px solid var(--line2);border-radius:999px;padding:7px 14px;
  font-size:.84rem;color:var(--steel)}
.crewcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.crewhead{display:flex;align-items:center;gap:9px;font-family:'Barlow Condensed';font-weight:700;
  font-size:1.05rem;letter-spacing:.5px;text-transform:uppercase;color:var(--steel)}
.crewcount{color:var(--mut);font-size:.78rem;font-family:'Barlow',sans-serif;font-weight:600;letter-spacing:0;text-transform:none}
.crewnote{font-size:.82rem;color:var(--mut);line-height:1.45;margin:9px 0 12px}
.opcard{display:flex;gap:13px;align-items:flex-start;background:#0c1015;border:1.5px solid var(--hi);
  border-radius:12px;padding:14px;margin:12px 0 6px}
.opbadge{flex:0 0 auto;width:46px;height:46px;border-radius:11px;background:var(--hi-d);border:1px solid #4a3a00;
  display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:1.15rem;color:var(--hi)}
.opfields{flex:1;min-width:0}
.opl{font-size:.7rem;letter-spacing:.7px;text-transform:uppercase;color:var(--hi);margin-bottom:8px;font-weight:600}
.oprow{display:flex;gap:8px;flex-wrap:wrap}
.opin{flex:1;min-width:140px;background:#11161d;border:1px solid var(--line2);color:var(--txt);
  border-radius:10px;padding:12px;font-family:inherit;font-size:1rem;min-height:48px}
.opin:focus{outline:none;border-color:var(--hi);box-shadow:0 0 0 3px rgba(255,176,0,.18)}
.ophint{font-size:.74rem;color:var(--mut2);margin-top:8px;line-height:1.4}
.crewrow.selfrow .crewin:disabled{opacity:.7;color:var(--steel);background:#0c1015}
.selftag{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 10px;
  font-size:.64rem;letter-spacing:.5px;text-transform:uppercase;color:var(--hi);background:var(--hi-d);
  border:1px solid #4a3a00;border-radius:8px;white-space:nowrap}
.crewrow{display:grid;grid-template-columns:1fr 84px 130px 44px;gap:8px;margin-bottom:9px}
.crewin{background:#0c1015;border:1px solid var(--line2);color:var(--txt);border-radius:10px;
  padding:11px;font-family:inherit;font-size:.95rem;min-height:46px}
.userchip{display:inline-flex;align-items:center;gap:9px;min-height:50px;padding:0 15px 0 8px;border-radius:11px;
  border:1.5px solid var(--line2);background:#11161d;color:var(--steel);font-family:inherit;font-weight:600;
  font-size:.92rem;cursor:pointer;transition:.12s}
.userchip .ub{width:34px;height:34px;border-radius:8px;background:#0c1015;border:1px solid var(--line2);
  display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:.92rem;color:var(--mut)}
.userchip.on{background:var(--hi);color:#1a1300;border-color:var(--hi)}
.userchip.on .ub{background:#1a1300;color:var(--hi);border-color:transparent}
.userchip:active{transform:scale(.97)}
.syncbadge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  padding:0 6px;border-radius:7px;font-size:.74rem;font-weight:700;color:var(--mut);line-height:1}
.syncbadge.live{color:var(--a)}
.syncbadge.q{background:var(--c);color:#1a1300}
@media(max-width:640px){ .crewrow{grid-template-columns:1fr 1fr;}.crewrow>*:nth-child(4){grid-column:2} }.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-size:.7rem;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.fld input,.fld select{background:#0c1015;border:1px solid var(--line2);color:var(--txt);
  border-radius:10px;padding:13px 12px;font-size:1rem;font-family:inherit;min-height:48px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--hi);box-shadow:0 0 0 3px rgba(255,176,0,.18)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:48px;border:1px solid var(--line2);background:#0c1015;color:var(--steel);
  border-radius:10px;font-family:inherit;font-weight:600;font-size:.95rem;cursor:pointer}
.seg button.on{background:var(--hi);color:#1a1300;border-color:var(--hi)}

/* task card */
.task{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 14px 14px 0;margin-bottom:12px;display:flex;gap:0;position:relative;overflow:hidden}
.task.flagged{border-color:var(--n);box-shadow:0 0 0 1px var(--n) inset}
.task .num{flex:0 0 56px;text-align:center;font-family:'Barlow Condensed';font-weight:700;
  font-size:1.5rem;color:var(--mut);padding-top:2px}
.task .body{flex:1;min-width:0}
.task .desc{font-size:.97rem;line-height:1.42;color:var(--steel)}
.task .desc b{color:var(--txt)}
.spec{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:.76rem;
  color:var(--hi);background:var(--hi-d);border:1px solid #4a3a00;border-radius:7px;padding:3px 9px}
.site-pill{display:inline-block;margin-bottom:6px;font-size:.64rem;letter-spacing:.7px;
  text-transform:uppercase;color:#ffd27a;background:#2a2000;border:1px solid #4a3a00;border-radius:6px;padding:3px 8px}
.refs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.refthumb{flex:0 0 auto;width:148px;background:#0c1015;border:1px solid var(--line2);border-radius:11px;
  overflow:hidden;cursor:zoom-in;transition:.15s}
.refthumb:active{transform:scale(.97)}
.refthumb .imgwrap{height:92px;background:#fff;display:grid;place-items:center;overflow:hidden;position:relative}
.refthumb img{width:100%;height:100%;object-fit:cover;object-position:center}
.refthumb .zoom{position:absolute;top:6px;right:6px;background:rgba(14,17,22,.8);color:var(--hi);
  font-size:.62rem;letter-spacing:.5px;padding:2px 7px;border-radius:6px;text-transform:uppercase}
.refthumb .cap{padding:8px 10px;font-size:.72rem;line-height:1.3;color:var(--mut)}
.lightbox{position:fixed;inset:0;background:rgba(4,7,11,.92);z-index:80;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:78vh;border-radius:12px;background:#fff;
  box-shadow:0 24px 60px rgba(0,0,0,.6)}
.lightbox .lcap{color:var(--steel);font-size:.95rem;text-align:center;max-width:680px}
.lightbox .lclose{position:absolute;top:18px;right:18px;width:48px;height:48px;border-radius:12px;
  border:1px solid var(--line2);background:#11161d;color:var(--txt);font-size:1.5rem;cursor:pointer}

/* ABCN control */
.abcn{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.abcn .opt{flex:1;min-width:62px;min-height:54px;border-radius:11px;border:1.5px solid var(--line2);
  background:#0c1015;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;transition:transform .08s, background .15s, border-color .15s}
.abcn .opt .k{font-family:'Barlow Condensed';font-weight:700;font-size:1.4rem;line-height:1}
.abcn .opt .d{font-size:.58rem;letter-spacing:.4px;text-transform:uppercase;color:var(--mut)}
.abcn .opt:active{transform:scale(.95)}
.abcn .opt.on .d{color:inherit;opacity:.85}
.abcn .opt[data-v=A].on{background:var(--a-d);border-color:var(--a);color:var(--a)}
.abcn .opt[data-v=B].on{background:var(--b-d);border-color:var(--b);color:var(--b)}
.abcn .opt[data-v=C].on{background:var(--c-d);border-color:var(--c);color:var(--c)}
.abcn .opt[data-v=N].on{background:var(--n-d);border-color:var(--n);color:var(--n)}
.abcn .opt[data-v=NA].on{background:var(--na-d);border-color:var(--na);color:var(--steel)}

.row2{display:flex;gap:10px;margin-top:11px;flex-wrap:wrap;align-items:flex-end}
.mini{display:flex;flex-direction:column;gap:5px}
.mini label{font-size:.66rem;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.initials input{width:120px}
.numbox{position:relative;display:flex;align-items:center}
.numbox input{width:130px;text-align:right;padding-right:42px}
.numbox .u{position:absolute;right:12px;font-size:.8rem;color:var(--mut);pointer-events:none}
.measure-flag{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:6px;margin-left:2px;align-self:center}
.measure-flag.ok{color:var(--ok);background:var(--a-d)}
.measure-flag.bad{color:#fff;background:var(--n)}
.comment{margin-top:11px;display:none}
.comment.show{display:block}
.comment textarea{width:100%;background:#0c1015;border:1px solid var(--line2);color:var(--txt);
  border-radius:10px;padding:11px 12px;font-family:inherit;font-size:.95rem;min-height:62px;resize:vertical}
.comment.req textarea{border-color:var(--c)}
.comment .hint{font-size:.7rem;color:var(--c);margin-bottom:5px}

/* dictation (voice-to-text) button */
.dict-host{position:relative;display:block}
.dict-host > input{padding-right:50px !important}
.dict-host > textarea{padding-right:54px !important}
.dictbtn{position:absolute;width:38px;height:38px;border-radius:9px;background:#11161d;
  border:1px solid var(--line2);color:var(--mut);display:grid;place-items:center;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s,transform .08s;z-index:2;padding:0}
.dictbtn.ta{bottom:8px;right:8px}
.dictbtn.single{right:5px;top:50%;transform:translateY(-50%)}
.dictbtn:hover{color:var(--steel);border-color:var(--mut2)}
.dictbtn:active{transform:scale(.93)}
.dictbtn.single:active{transform:translateY(-50%) scale(.93)}
.dictbtn.on{background:var(--n);color:#fff;border-color:var(--n);
  animation:micpulse 1.3s ease-in-out infinite}
@keyframes micpulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,77,77,.55)}
  50%{box-shadow:0 0 0 9px rgba(255,77,77,0)}
}

/* multi points */
.points{margin-top:12px;display:grid;gap:8px}
.point{display:flex;align-items:center;gap:10px;background:#0c1015;border:1px solid var(--line);
  border-radius:11px;padding:8px 8px 8px 14px;flex-wrap:wrap}
.point .pl{flex:1;min-width:120px;font-size:.9rem;color:var(--steel)}
.point .abcn{margin-top:0;flex:0 0 auto}
.point .abcn .opt{min-width:50px;min-height:46px}
.point .abcn .opt .k{font-size:1.15rem}.point .abcn .opt .d{display:none}

/* grid tables */
.gtbl{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gtbl .gr{display:grid;border-bottom:1px solid var(--line);align-items:center}
.gtbl .gr:last-child{border-bottom:0}
.gtbl .gr.head{background:#0c1015;font-size:.68rem;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.gtbl .gc{padding:10px 12px;display:flex;align-items:center;gap:8px}
.gtbl .gc.lab{font-family:'Barlow Condensed';font-weight:700;font-size:1.05rem;color:var(--steel)}
.gtbl .gr.alert{background:var(--n-d)}
.gtbl input,.gtbl select{background:#11161d;border:1px solid var(--line2);color:var(--txt);
  border-radius:9px;padding:11px 10px;font-size:.95rem;font-family:inherit;width:100%;min-height:46px}
.gtbl .pill{font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:5px}
.gtbl .pill.bad{background:var(--n);color:#fff}.gtbl .pill.ok{background:var(--a-d);color:var(--ok)}

/* sign blocks */
.task.signrow{padding:14px}
.signctl{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.bigtoggle{min-height:54px;padding:0 20px;border-radius:11px;border:1.5px solid var(--line2);
  background:#0c1015;color:var(--steel);font-family:inherit;font-weight:600;font-size:.95rem;cursor:pointer;
  display:flex;align-items:center;gap:9px}
.bigtoggle .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--mut2);display:grid;place-items:center}
.bigtoggle.on{background:var(--a-d);border-color:var(--a);color:var(--a)}
.bigtoggle.on .box{background:var(--a);border-color:var(--a)}
.bigtoggle.on .box::after{content:"✓";color:#06140c;font-size:.85rem;font-weight:800}

/* dynamic tables: add'l work + signatures */
.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.reg-empty{color:var(--mut);font-size:.9rem;background:#0c1015;border:1px dashed var(--line2);
  border-radius:11px;padding:16px;text-align:center}
.reg-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rstat{flex:1;min-width:84px;background:#0c1015;border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;display:flex;flex-direction:column;gap:1px}
.rstat b{font-family:'Barlow Condensed';font-weight:700;font-size:1.7rem;line-height:1}
.rstat span{font-size:.64rem;letter-spacing:.4px;text-transform:uppercase;color:var(--mut)}
.rstat.down{border-color:var(--a)}.rstat.down b{color:var(--a)}
.rstat.next{border-color:var(--c)}.rstat.next b{color:var(--c)}
.rstat.mon{border-color:var(--b)}.rstat.mon b{color:var(--b)}
.rstat.open{border-color:var(--n)}.rstat.open b{color:var(--n)}
.regrow{background:#0c1015;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.reg-head{display:flex;gap:12px;align-items:flex-start}
.reg-badge{flex:0 0 auto;font-family:'Barlow Condensed';font-weight:700;font-size:1.1rem;width:40px;height:40px;
  border-radius:9px;display:grid;place-items:center}
.reg-badge.A{background:var(--a-d);color:var(--a)}.reg-badge.B{background:var(--b-d);color:var(--b)}
.reg-badge.C{background:var(--c-d);color:var(--c)}.reg-badge.N{background:var(--n-d);color:var(--n)}
.reg-meta{flex:1;min-width:0}
.reg-step{font-family:'Barlow Condensed';font-weight:700;font-size:.95rem;letter-spacing:.3px;color:var(--steel)}
.reg-task{font-size:.84rem;color:var(--mut);line-height:1.35;margin-top:2px}
.reg-cmt{font-size:.84rem;color:var(--steel);margin-top:5px;font-style:italic}
.reg-ctl{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;align-items:flex-end}
.reg-notif{display:flex;flex-direction:column;gap:5px}
.reg-notif label,.reg-disp label{font-size:.66rem;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.reg-notif input{background:#11161d;border:1px solid var(--line2);color:var(--txt);border-radius:9px;
  padding:11px;font-family:inherit;font-size:.95rem;min-height:46px;width:150px}
.reg-disp{display:flex;flex-direction:column;gap:5px;flex:1;min-width:240px}
.dispseg{display:flex;gap:6px;flex-wrap:wrap}
.dispbtn{flex:1;min-width:96px;min-height:46px;border-radius:9px;border:1.5px solid var(--line2);
  background:#11161d;color:var(--steel);font-family:inherit;font-weight:600;font-size:.82rem;cursor:pointer;transition:.12s}
.dispbtn:active{transform:scale(.96)}
.dispbtn.a.on{background:var(--a-d);border-color:var(--a);color:var(--a)}
.dispbtn.c.on{background:var(--c-d);border-color:var(--c);color:var(--c)}
.dispbtn.b.on{background:var(--b-d);border-color:var(--b);color:#cfe2ff}
.block h3{margin:0 0 12px;font-family:'Barlow Condensed';font-weight:700;font-size:1.18rem;
  text-transform:uppercase;letter-spacing:.4px}
.awrow,.sigrow{display:grid;gap:10px;margin-bottom:10px;align-items:end}
.awrow{grid-template-columns:1fr 130px 150px 44px}
.sigrow{grid-template-columns:1fr 150px 130px 44px}
.btn-add{background:#0c1015;border:1px dashed var(--line2);color:var(--hi);border-radius:10px;
  padding:11px;width:100%;font-family:inherit;font-weight:600;cursor:pointer;font-size:.9rem}
.btn-del{min-height:46px;border-radius:10px;border:1px solid var(--line2);background:#0c1015;
  color:var(--n);font-size:1.2rem;cursor:pointer}
.subhead{font-size:.72rem;letter-spacing:.7px;text-transform:uppercase;color:var(--hi);margin:14px 0 8px}
textarea.free{width:100%;min-height:120px;background:#0c1015;border:1px solid var(--line2);color:var(--txt);
  border-radius:10px;padding:12px;font-family:inherit;font-size:.95rem;resize:vertical}
.sigpad-wrap{display:flex;flex-direction:column;gap:6px}
canvas.sigpad{background:#0c1015;border:1px solid var(--line2);border-radius:10px;width:100%;height:90px;touch-action:none}
.sigpad-tools{display:flex;gap:8px}
.sigpad-tools button{flex:1;background:#11161d;border:1px solid var(--line2);color:var(--mut);
  border-radius:8px;padding:7px;font-size:.78rem;font-family:inherit;cursor:pointer}

/* footer action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(0deg,#0c1015,#11161d);border-top:1px solid var(--line);
  box-shadow:0 -8px 24px rgba(0,0,0,.5);padding:11px 16px;
  padding-bottom:calc(11px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.savestate{font-size:.74rem;color:var(--mut);flex:1;display:flex;align-items:center;gap:8px}
.savestate .pulse{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.btn{min-height:52px;padding:0 22px;border-radius:12px;border:0;font-family:inherit;font-weight:700;
  font-size:1rem;cursor:pointer;display:flex;align-items:center;gap:9px;letter-spacing:.3px}
.btn.ghost{background:var(--panel2);color:var(--steel);border:1px solid var(--line2)}
.btn.primary{background:var(--hi);color:#1a1300;box-shadow:0 4px 14px rgba(255,176,0,.3)}
.btn:active{transform:translateY(1px)}
.dlic{font-size:1.05rem;line-height:1}
.savechoice{display:flex;flex-direction:column;gap:9px}
.savechoice .btn{justify-content:flex-start;flex-direction:column;align-items:flex-start;gap:2px;min-height:58px;padding:11px 16px;width:100%}
.savechoice .btn b{font-size:1rem;font-family:'Barlow Condensed';letter-spacing:.3px}
.savechoice .btn span{font-size:.76rem;color:var(--mut);font-weight:400}
.savechoice .btn.primary span{color:#3a2e00}
@media(max-width:680px){
  .actionbar{padding-left:12px;padding-right:12px;gap:7px}
  .savestate{display:none}
  .btn{padding:0 15px;font-size:.92rem}
}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,7,11,.72);z-index:60;display:none;
  align-items:center;justify-content:center;padding:20px}
.scrim.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:18px;max-width:560px;width:100%;
  max-height:84vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-h h3{margin:0;font-family:'Barlow Condensed';font-weight:700;font-size:1.3rem;text-transform:uppercase}
.modal-h .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:1.1rem;flex:0 0 auto}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px 20px;display:flex;gap:10px;justify-content:flex-end}
.issue{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.92rem;color:var(--steel)}
.issue:last-child{border-bottom:0}
.issue .jn{color:var(--n);font-weight:700;flex:0 0 auto}
.issue a{color:var(--hi);text-decoration:none}
.ok-banner{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:600}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);z-index:70;
  background:#11161d;border:1px solid var(--line2);color:var(--txt);padding:12px 20px;border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:.25s;font-size:.92rem;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--hi);
  animation:sp .8s linear infinite;margin:6px auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
.cfgfld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.cfgfld label{font-size:.74rem;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.cfgfld input{background:#0c1015;border:1px solid var(--line2);color:var(--txt);border-radius:10px;
  padding:12px;font-family:inherit;font-size:.92rem;min-height:46px}
.cfgfld input:focus{outline:none;border-color:var(--hi)}
.cfgfld .help{font-size:.74rem;color:var(--mut2)}
.statusdot{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:var(--mut)}
.statusdot i{width:8px;height:8px;border-radius:50%;background:var(--mut2)}
.statusdot.set i{background:var(--ok)}
.legend-grid{display:grid;gap:8px;margin-top:4px}
.legend-grid .lg{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--steel)}
.legend-grid .k{font-family:'Barlow Condensed';font-weight:700;width:26px;height:26px;border-radius:7px;
  display:grid;place-items:center;flex:0 0 auto;font-size:1rem}
.k.A{background:var(--a-d);color:var(--a)}.k.B{background:var(--b-d);color:var(--b)}
.k.C{background:var(--c-d);color:var(--c)}.k.N{background:var(--n-d);color:var(--n)}
.helpbtn{background:transparent;border:1px solid var(--line2);color:var(--mut);border-radius:9px;
  width:42px;height:42px;font-size:1.1rem;cursor:pointer;flex:0 0 auto}
@media(max-width:640px){
  :root{font-size:16px}
  .awrow{grid-template-columns:1fr 1fr;}.awrow>*:nth-child(4){grid-column:2}
  .sigrow{grid-template-columns:1fr 1fr}
  .tb-id .t{font-size:1.1rem}
}
</style>

<script>
/* ===== storage shim: window.storage (Claude preview) -> localStorage (deployed tablet) -> memory ===== */
const Store = (()=>{
  const mem={};
  const hasWS = typeof window!=='undefined' && window.storage && typeof window.storage.set==='function';
  return {
    async get(k){ try{
      if(hasWS){ const r=await window.storage.get(k); return r? r.value : null; }
      const v=localStorage.getItem(k); return v;
    }catch(e){ return mem[k]??null; } },
    async set(k,v){ try{
      if(hasWS){ await window.storage.set(k,v); return; }
      localStorage.setItem(k,v);
    }catch(e){ mem[k]=v; } }
  };
})();
const DRAFT_KEY='cat793f_draft_v1';
const APP_VERSION='v7';
const CONFIG_KEY='cat793f_config_v1';
const OUTBOX_KEY='cat793f_outbox_v1';
const config={ endpoint:'', apiKey:'', activeUser:'', operatorName:'', operatorSap:'', syncUrl:'', live:false };
let outbox=[];                                            // queued submissions awaiting signal
async function loadConfig(){ try{ const raw=await Store.get(CONFIG_KEY); if(raw)Object.assign(config,JSON.parse(raw)); }catch(e){}
  if(config.activeUser&&!config.operatorName)config.operatorName=config.activeUser; }
async function saveConfig(){ try{ await Store.set(CONFIG_KEY,JSON.stringify(config)); }catch(e){} }
async function loadOutbox(){ try{ const raw=await Store.get(OUTBOX_KEY); if(raw)outbox=JSON.parse(raw)||[]; }catch(e){ outbox=[]; } }
async function saveOutbox(){ try{ await Store.set(OUTBOX_KEY,JSON.stringify(outbox)); }catch(e){} }

/* ===== state ===== */
const state = {
  meta:{ wo:'', site:'', dept:'', date:new Date().toISOString().slice(0,10), pit:'', machineId:'',
         hours:'', ambient:'', shift:'', crew:'', interval:'routine' },
  crew:[],           // [{name, sap, initials}] roster of people on this inspection
  results:{},        // key -> {status, initials, comment, vals:{}, points:{}, grid:{}, done, by}
  addWork:[],        // {detail, completed, notif}
  comments:'',
  maint:[],          // {name, sap, date, sig}
  sup:[],
  safety:{ ack:false, swiSigned:false, takeControl:false, jhaRaised:false },
};
const SEV={ '':-1, 'NA':0, 'A':1, 'B':2, 'C':3, 'N':4 };
function sevOf(s){ return SEV[s]!=null?SEV[s]:-1; }
function initialsFor(name){ if(!name)return ''; const p=name.trim().split(/\s+/); return ((p[0]||'')[0]||'').toUpperCase()+((p[1]||'')[0]||'').toUpperCase(); }
function operatorInitials(){ return initialsFor(config.operatorName||config.activeUser||''); }
// auto-fill a step's initials from the operator when they make an entry, unless already hand-edited
function autoInitials(r){ if(r._initEdited)return; const oi=operatorInitials(); if(oi){ r.initials=oi;
  const inp=document.querySelector(`input[data-init="${r._k||''}"]`); if(inp)inp.value=oi; } }
function touchBy(r){ const n=config.operatorName||config.activeUser||''; if(n){ r.by=n; r.bySap=config.operatorSap||''; } }
function ensureOperatorInCrew(){
  const n=(config.operatorName||'').trim(); if(!n)return;
  let e=state.crew.find(c=>(c.name||'').trim().toLowerCase()===n.toLowerCase());
  if(!e){ e={name:n, sap:config.operatorSap||'', initials:initialsFor(n), self:true}; state.crew.push(e); }
  else { e.self=true; if(config.operatorSap)e.sap=config.operatorSap; if(!e.initials)e.initials=initialsFor(n); }
}

/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const boldify=s=>esc(s).replace(/\b(Inspect|Check|Test|Measure|Move|Press|Grease|Setup|Set up|Isolate|Review|Remove|Replace|Record|Calculate|Open|Clean|Close|Report|Note|Refit|Invert|Pre-inspect|Fully wash|Listen|Loosen|Re-torque)\b/g,'<b>$1</b>');
function sectionsFor(interval){ return FORM.sections.filter(s=>SECTION_INTERVALS[s.gate].includes(interval)); }
function isActive(sec){ return SECTION_INTERVALS[sec.gate].includes(state.meta.interval); }
function res(k){ return state.results[k] || (state.results[k]={status:'',initials:'',comment:'',vals:{},points:{},grid:{},done:false,notif:'',disp:'',by:'',bySap:''}); }

const DISPOSITIONS=[
  {v:'Completed — machine down', s:'Completed (down)', cls:'a'},
  {v:'Planned — next service',   s:'Planned (next)',  cls:'c'},
  {v:'Monitor',                  s:'Monitor',         cls:'b'},
];
function defectActive(step,r){
  if(step.kind==='abcn'||step.kind==='measure')return ['B','C','N'].includes(r.status);
  if(step.kind==='abcnMulti')return step.points && Object.keys(r.points||{}).some(pk=>['B','C','N'].includes(r.points[pk]));
  if(step.kind==='grid'){
    return step.rows.some((rn,ri)=>{ const cell=(r.grid||{})['r'+ri]||{};
      return step.columns.some((c,ci)=>{ const v=cell['c'+ci];
        if(c.type==='num'&&v!==''&&v!=null&&!isNaN(parseFloat(v))){const x=parseFloat(v);if((c.min!=null&&x<=c.min)||(c.max!=null&&x>c.max))return true;}
        if(c.alertOptions&&c.alertOptions.includes(v))return true; return false; }); });
  }
  return false;
}
function defectCode(step,r){
  if(step.kind==='abcn'||step.kind==='measure')return r.status;
  if(step.kind==='abcnMulti')return [...new Set(Object.keys(r.points||{}).map(pk=>r.points[pk]).filter(s=>['B','C','N'].includes(s)))].join('/');
  if(step.kind==='grid')return 'ALERT';
  return '';
}

/* accumulator target from ambient temp (linear interpolation) */
function accTarget(){
  const t=parseFloat(state.meta.ambient); if(isNaN(t))return null;
  const T=ACC_TABLE; if(t<=T[0][0])return T[0][1]; if(t>=T[T.length-1][0])return T[T.length-1][1];
  for(let i=0;i<T.length-1;i++){ if(t>=T[i][0]&&t<=T[i+1][0]){
    const f=(t-T[i][0])/(T[i+1][0]-T[i][0]); return Math.round(T[i][1]+f*(T[i+1][1]-T[i][1])); } }
  return null;
}
/* evaluate one numeric field -> 'ok'|'bad'|null */
function evalField(f,v){
  if(v===''||v==null||isNaN(parseFloat(v)))return null;
  const x=parseFloat(v);
  if(f.accum){ const tg=accTarget(); if(tg==null)return null; return Math.abs(x-tg)<=10?'ok':'bad'; }
  let ok=true;
  if(f.min!=null && x<f.min)ok=false;
  if(f.max!=null && x>f.max)ok=false;
  return ok?'ok':'bad';
}

const SITES=['Christmas Creek','Cloudbreak','Solomon','Eliwana','Flying Fish','Blacksmith','Iron Bridge'];

function metaPanel(){
  const card=el('div','metacard');
  const grid=el('div','mgrid');
  const f=(key,label,type='text',ph='')=>{
    const w=el('div','fld');
    w.innerHTML=`<label>${label}</label>`;

    if(type==='number')i.inputMode='decimal';
    i.oninput=()=>{ state.meta[key]=i.value; save(); if(key==='ambient')refreshAccum(); };
    w.appendChild(i); return w;
  };
  const sel=(key,label,options,ph='Select…')=>{
    const w=el('div','fld');
    w.innerHTML=`<label>${label}</label>`;
    const s=el('select');
    s.appendChild(el('option','','')); s.lastChild.textContent=ph; s.lastChild.value='';
    options.forEach(o=>{ const op=el('option'); op.value=o; op.textContent=o; if(state.meta[key]===o)op.selected=true; s.appendChild(op); });
    s.onchange=()=>{ state.meta[key]=s.value; save(); };
    w.appendChild(s); return w;
  };
  grid.append(
    f('wo','Work Order No.','text','WO…'),
    sel('site','Site',SITES),
    f('dept','Department','text','e.g. Haul, Excavators…'),
    f('pit','Pit / Location'),
    f('machineId','Machine ID','text','e.g. DT123'),
    f('hours','HMU / SMU Hours','number'),

  ['Day','Night'].forEach(o=>{ const b=el('button',state.meta.shift===o?'on':'',o);

    shiftSeg.appendChild(b);}); shiftW.appendChild(shiftSeg); grid.appendChild(shiftW);
  // crew
  const crewW=el('div','fld'); crewW.innerHTML='<label>Crew</label>';

    crewSeg.appendChild(b);}); crewW.appendChild(crewSeg); grid.appendChild(crewW);
  card.appendChild(grid);
  return card;

function crewPanel(){

function dictationSupported(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function attachDictate(target){
  if(!dictationSupported()||!target||!target.parentNode)return;
  const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  let host=target.parentNode;
  if(!host.classList||!host.classList.contains('dict-host')){
    host=el('div','dict-host'); target.parentNode.insertBefore(host,target); host.appendChild(target);
  }
  const isTA=target.tagName==='TEXTAREA';
  const btn=el('button','dictbtn'+(isTA?' ta':' single')); btn.type='button';
  btn.title='Dictate (voice to text)'; btn.setAttribute('aria-label','Dictate');
  btn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  let rec=null, listening=false, base='';
  const stop=()=>{ if(rec){try{rec.stop();}catch(e){}} listening=false; btn.classList.remove('on'); };
  btn.onclick=(ev)=>{ ev.preventDefault();
    if(listening){ stop(); return; }
    try{
      rec=new Rec(); rec.lang='en-AU'; rec.continuous=true; rec.interimResults=true;
      base=target.value||''; if(base && !/\s$/.test(base)) base+=' ';
      rec.onresult=(e)=>{ let txt=''; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript;
        target.value=base+txt; target.dispatchEvent(new Event('input',{bubbles:true})); };
      rec.onerror=(e)=>{
        if(e.error==='not-allowed') toast('Allow microphone access in browser settings');
        else if(e.error==='audio-capture') toast('No microphone available');
        else if(e.error!=='no-speech'&&e.error!=='aborted') toast('Voice error: '+e.error);
        stop();
      };
      rec.onend=()=>{ btn.classList.remove('on'); listening=false; };
      rec.start(); listening=true; btn.classList.add('on');
    }catch(e){ toast('Voice input not supported in this browser'); stop(); }
  };
  host.appendChild(btn);
}

          grp.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x.dataset.v===r.points['p'+pi]));
          touchBy(r); if(r.points['p'+pi])autoInitials(r); save(); updateProgress(); setDefect(k,step); rebuildRegister(); };
        grp.appendChild(o);
      });
      row.appendChild(grp); pts.appendChild(row);
    });
    b.appendChild(pts);
    const ini=el('div','row2'); ini.appendChild(initialsField(k)); b.appendChild(ini);
    b.appendChild(commentBox(k,step));

      r.grid['r'+ri]=r.grid['r'+ri]||{};
      const cell=r.grid['r'+ri];
      let alertFn=()=>{};
      cols.forEach((c,ci)=>{
        const gc=el('div','gc');
        if(c.type==='num'){
          const box=el('div','numbox'); box.style.width='100%';
          const i=el('input'); i.type='text'; i.inputMode='decimal'; i.value=cell['c'+ci]??'';
          i.style.textAlign='left'; i.style.paddingRight='10px';
          i.oninput=()=>{cell['c'+ci]=i.value;evalRow();touchBy(r);if((i.value||'').trim())autoInitials(r);save();updateProgress();setDefect(k,step);rebuildRegister();};
          box.appendChild(i); gc.appendChild(box);

          const sel=el('select');
          sel.appendChild(el('option','','')); sel.lastChild.textContent='–';
          c.options.forEach(op=>{const o=el('option');o.value=op;o.textContent=op;if(cell['c'+ci]===op)o.selected=true;sel.appendChild(o);});
          sel.onchange=()=>{cell['c'+ci]=sel.value;evalRow();touchBy(r);if(sel.value)autoInitials(r);save();updateProgress();setDefect(k,step);rebuildRegister();};
          gc.appendChild(sel);
        }
        gr.appendChild(gc);
      });
      const pill=el('span','pill'); pill.style.display='none'; gr.children[gr.children.length-1].appendChild(pill);
      function evalRow(){
        let bad=false;
        cols.forEach((c,ci)=>{
          const v=cell['c'+ci];
          if(c.type==='num'&&v!==''&&v!=null&&!isNaN(parseFloat(v))){
            const x=parseFloat(v);
            if(c.min!=null&&x<=c.min)bad=true;
            if(c.max!=null&&x>c.max)bad=true;
          }
          if(c.alertOptions&&c.alertOptions.includes(v))bad=true;
        });
        gr.classList.toggle('alert',bad);
        pill.style.display=bad?'inline-block':'none';
        if(bad){pill.className='pill bad';pill.textContent='ALERT';}
      }
      evalRow();
      tbl.appendChild(gr);
    });
    b.appendChild(tbl);
    const gini=el('div','row2'); gini.appendChild(initialsField(k)); b.appendChild(gini);
    b.appendChild(commentBox(k,step));
  }

  t.appendChild(b);

/* ===== progress ===== */
function requiredKeys(){
  const keys=[];
  sectionsFor(state.meta.interval).forEach(sec=>sec.steps.forEach(st=>{
    if(st.kind!=='info')keys.push({sec,st,k:sec.id+'_'+st.n});
  }));
  return keys;
}
function stepComplete(st,r){
  if(st.kind==='sign')return r.done||r.initials.trim()!=='';
  if(st.kind==='abcn')return r.status!=='';
  if(st.kind==='measure'){ const hasVals=st.fields.every((f,i)=>!f.diffB && (r.vals['f'+i]??'')!==''||f.diffB); return r.status!==''; }
  if(st.kind==='abcnMulti')return st.points.every((p,i)=>(r.points['p'+i]||'')!=='');
  if(st.kind==='grid')return st.rows.every((row,ri)=>{ const cell=r.grid['r'+ri]||{}; return st.columns.some((c,ci)=>(cell['c'+ci]??'')!==''); });
  return false;
}
function updateProgress(){
  const keys=requiredKeys(); let done=0;
  keys.forEach(({st,k})=>{ if(stepComplete(st,res(k)))done++; });
  const total=keys.length, pct=total?Math.round(done/total*100):0;
  $('#progCount').textContent=`${done} / ${total}`;
  $('#progPct').textContent=pct+'%';
  const arc=$('#progArc'), C=100.5; arc.style.strokeDashoffset=C-(C*pct/100);
  // nav chip done state
  sectionsFor(state.meta.interval).forEach(sec=>{
    const chip=$(`.chip[data-sec="${sec.id}"]`); if(!chip)return;
    const all=sec.steps.filter(s=>s.kind!=='info');
    const allDone=all.length>0 && all.every(st=>stepComplete(st,res(sec.id+'_'+st.n)));
    chip.classList.toggle('done',allDone);
  });
}

function gatherDefects(){
  const defs=[];
  sectionsFor(state.meta.interval).forEach(sec=>sec.steps.forEach(step=>{
    if(step.kind==='info')return;
    const k=sec.id+'_'+step.n; const r=res(k);
    if(defectActive(step,r)) defs.push({k,sec,step,r,code:defectCode(step,r)});

function setupPad(cv,clrBtn,p){
  requestAnimationFrame(()=>{ const r=cv.getBoundingClientRect(); cv.width=r.width*2; cv.height=r.height*2;
    const ctx=cv.getContext('2d'); ctx.scale(2,2); ctx.strokeStyle='#e8edf2'; ctx.lineWidth=2; ctx.lineCap='round';
    if(p.sig){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height);img.src=p.sig;}
    let drawing=false,last=null;
    const pos=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-b.left,y:t.clientY-b.top};};
    const start=e=>{drawing=true;last=pos(e);e.preventDefault();};
    const move=e=>{if(!drawing)return;const pt=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(pt.x,pt.y);ctx.stroke();last=pt;e.preventDefault();};
    const end=()=>{if(drawing){drawing=false;p.sig=cv.toDataURL('image/png');save();}};
    cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
    cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);
    clrBtn.onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);p.sig='';save();};
  });
}

  state.safety=Object.assign({ack:false,swiSigned:false,takeControl:false,jhaRaised:false},d.safety||{}); } }catch(e){} }

/* ===== validation + export ===== */
function validate(){
  const issues=[];
  if(!state.meta.wo.trim())issues.push({jn:'!',txt:'Work Order No. is blank.'});
  if(!state.meta.machineId.trim())issues.push({jn:'!',txt:'Machine ID is blank.'});
  if(!state.meta.interval)issues.push({jn:'!',txt:'Service interval not selected.'});
  if(!(config.operatorName||'').trim())issues.push({jn:'\uD83D\uDC64',txt:'Operator name not set for this tablet (Crew panel).'});
  if(!(config.operatorSap||'').trim())issues.push({jn:'\uD83D\uDC64',txt:'Operator SAP number not set for this tablet (Crew panel).'});
  if(!state.safety.swiSigned)issues.push({jn:'⚠',txt:'SWI not reviewed & signed (Risk Assessment).'});
  if(!state.safety.takeControl)issues.push({jn:'⚠',txt:'Take Control not confirmed complete (Risk Assessment).'});
  if(!state.safety.ack)issues.push({jn:'⚠',txt:'Safety precautions not acknowledged.'});
  let accNeeded=false;
  requiredKeys().forEach(({sec,st,k})=>{
    const r=res(k);
    if(st.accum||(st.fields&&st.fields.some(f=>f.accum)))accNeeded=true;
    if(!stepComplete(st,r))issues.push({jn:st.n,txt:`Step ${st.n} incomplete (${sec.title.split('—')[0].trim()}).`});
    if(['B','C','N'].includes(r.status)&&!r.comment.trim())issues.push({jn:st.n,txt:`Step ${st.n} marked ${r.status} — comment required.`});
    if(defectActive(st,r)){
      const code=defectCode(st,r);
      if(!(r.disp||'').trim())issues.push({jn:'⚑',txt:`Step ${st.n} defect — set a disposition in the register (completed / planned / monitor).`});
      if(/[CN]/.test(code)&&!(r.notif||'').trim())issues.push({jn:'⚑',txt:`Step ${st.n} (${code}) — record the SAP notification number.`});
    }
  });
  if(accNeeded&&!state.meta.ambient)issues.push({jn:'!',txt:'Ambient Temp needed to verify accumulator charges.'});
  if(!state.maint.length||!state.maint.some(p=>p.name.trim()))issues.push({jn:'✎',txt:'At least one Maintenance Personnel sign-off required.'});
  return issues;
}
function flatRecords(){
  const id=(state.meta.wo||'NO-WO').trim().toUpperCase().replace(/\s+/g,'-');
  const header={ InspectionID:id, WorkOrder:state.meta.wo, Doc:FORM.docNo, Rev:FORM.rev, Asset:FORM.asset,
    Site:state.meta.site, Department:state.meta.dept, Pit:state.meta.pit, MachineID:state.meta.machineId,
    Hours:state.meta.hours, AmbientTempC:state.meta.ambient, Date:state.meta.date,
    Shift:state.meta.shift, Crew:state.meta.crew, Interval:state.meta.interval,
    CrewMembers:state.crew.filter(c=>c.name.trim()).map(c=>c.name+(c.sap?(' ('+c.sap+')'):'')).join('; '),
    OperatorName:config.operatorName||'', OperatorSAP:config.operatorSap||'',
    RiskAssessment:raList(), SWISigned:state.safety.swiSigned?'Y':'N', TakeControlCompleted:state.safety.takeControl?'Y':'N', JHARaised:state.safety.jhaRaised?'Y':'N', SafetyAcknowledged:state.safety.ack?'Y':'N',
    DefectsTotal:0, DefectsCompletedDown:0, DefectsPlannedNext:0, DefectsMonitor:0, DefectsUnassigned:0,
    SubmittedAt:new Date().toISOString() };
  (function(){ const defs=gatherDefects(); header.DefectsTotal=defs.length;
    defs.forEach(({r})=>{ if(r.disp==='Completed — machine down')header.DefectsCompletedDown++;
      else if(r.disp==='Planned — next service')header.DefectsPlannedNext++;
      else if(r.disp==='Monitor')header.DefectsMonitor++; else header.DefectsUnassigned++; }); })();
  const rows=[];
  const push=(o)=>rows.push(Object.assign({InspectionID:id,MachineID:state.meta.machineId,WorkOrder:state.meta.wo,Date:state.meta.date,Interval:state.meta.interval},o));
  sectionsFor(state.meta.interval).forEach(sec=>sec.steps.forEach(st=>{
    if(st.kind==='info')return;
    const r=res(sec.id+'_'+st.n);
    const base={Section:sec.title,Step:st.n,Task:st.task.replace(/\s+/g,' ').slice(0,300),NotificationNo:r.notif||'',Disposition:r.disp||'',EnteredBy:r.by||'',EnteredBySAP:r.bySap||''};
    if(st.kind==='sign'){ push(Object.assign({},base,{Type:'sign',Result:r.done?'Completed':'',Initials:r.initials,Point:'',Measure:'',Value:'',Unit:'',Flag:'',Comment:''})); }
    else if(st.kind==='abcn'){ push(Object.assign({},base,{Type:'status',Result:r.status,Initials:r.initials,Point:'',Measure:'',Value:'',Unit:'',Flag:'',Comment:r.comment})); }
    else if(st.kind==='measure'){ st.fields.forEach((f,i)=>{ const v=r.vals['f'+i]??''; const fl=evalField(f,v);
      push(Object.assign({},base,{Type:'measure',Result:r.status,Initials:r.initials,Point:'',Measure:f.label,Value:v,Unit:f.unit||'',Flag:fl==='bad'?'OUT_OF_SPEC':(fl==='ok'?'IN_SPEC':''),Comment:r.comment})); }); }
    else if(st.kind==='abcnMulti'){ st.points.forEach((p,i)=>{ push(Object.assign({},base,{Type:'status',Result:r.points['p'+i]||'',Initials:r.initials||'',Point:p,Measure:'',Value:'',Unit:'',Flag:'',Comment:r.comment})); }); }
    else if(st.kind==='grid'){ st.rows.forEach((rowName,ri)=>{ const cell=r.grid['r'+ri]||{};
      st.columns.forEach((c,ci)=>{ const v=cell['c'+ci]??''; if(v==='')return;
        let flag=''; if(c.type==='num'&&!isNaN(parseFloat(v))){const x=parseFloat(v);if((c.min!=null&&x<=c.min)||(c.max!=null&&x>c.max))flag='ALERT';}
        if(c.alertOptions&&c.alertOptions.includes(v))flag='ALERT';
        push(Object.assign({},base,{Type:'grid',Result:'',Initials:r.initials||'',Point:rowName,Measure:c.label,Value:v,Unit:c.unit||'',Flag:flag,Comment:r.comment})); }); }); }
  }));
  state.addWork.forEach((w,i)=>{ if(w.detail.trim()) push({Section:'Additional Work Identified',Step:'AW'+(i+1),Task:w.detail,NotificationNo:w.notif,Disposition:'',Type:'addwork',Result:w.completed==='Y'?'Completed':(w.completed==='N'?'Outstanding':''),Initials:'',Point:'',Measure:'Notification',Value:w.notif,Unit:'',Flag:'',Comment:''}); });
  return {header,rows};
}
function toCSV(rows){
  if(!rows.length)return '';
  const cols=Object.keys(rows[0]);
  const q=v=>{ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return cols.join(',')+'\n'+rows.map(r=>cols.map(c=>q(r[c])).join(',')).join('\n');
}
function buildBundle(){
  const {header,rows}=flatRecords();

    signatures:{ maintenance:state.maint.map(p=>({name:p.name,sap:p.sap,date:p.date,signed:!!p.sig})),

function queueSubmission(bundle){ outbox=outbox.filter(o=>o.wo!==bundle.header.InspectionID); // keep latest per WO
  outbox.push({wo:bundle.header.InspectionID, ts:new Date().toISOString(), bundle}); saveOutbox(); updateSyncBadge(); }
async function flushOutbox(){
  if(!config.endpoint||!outbox.length||(typeof navigator!=='undefined'&&navigator.onLine===false))return;
  const headers={'Content-Type':'application/json'}; if(config.apiKey)headers['x-api-key']=config.apiKey;
  const remaining=[]; let sent=0;
  for(const item of outbox){ try{ const r=await fetch(config.endpoint,{method:'POST',headers,body:JSON.stringify(item.bundle)});
      if(r.ok)sent++; else remaining.push(item); }catch(e){ remaining.push(item); } }
  outbox=remaining; await saveOutbox(); updateSyncBadge();
  if(sent)toast(sent+' queued submission'+(sent>1?'s':'')+' sent');
}
function updateSyncBadge(){ const b=$('#syncBadge'); if(!b)return;
  const live=config.syncUrl&&config.live; const q=outbox.length;
  b.className='syncbadge'+(live?' live':'')+(q?' q':'');
  b.innerHTML = q ? `&#9203; ${q}` : (live ? '&#9679; live' : '&#8644;');
  b.title = q ? (q+' queued to send') : (live ? 'Live sync on' : 'Crew sync');
}

/* ===== multi-user: merge + live sync ===== */
function mergeState(inc){
  if(!inc||typeof inc!=='object'||!inc.results) return {error:'Not a valid inspection file.'};
  if(inc.meta&&inc.meta.wo&&state.meta.wo&&inc.meta.wo.trim().toUpperCase()!==state.meta.wo.trim().toUpperCase())
    return {error:'Different Work Order ('+inc.meta.wo+') — not merged.'};
  let tasks=0, conflicts=0, addedCrew=0;
  // meta: fill blanks only
  if(inc.meta)Object.keys(inc.meta).forEach(k=>{ if(!state.meta[k]&&inc.meta[k])state.meta[k]=inc.meta[k]; });
  // crew union by name
  (inc.crew||[]).forEach(c=>{ if(c.name&&c.name.trim()&&!state.crew.some(x=>x.name.trim().toLowerCase()===c.name.trim().toLowerCase())){ state.crew.push({name:c.name,sap:c.sap||'',initials:c.initials||''}); addedCrew++; } });
  // results
  Object.keys(inc.results||{}).forEach(key=>{
    const ri=inc.results[key]; const li=state.results[key];
    if(!li){ state.results[key]=JSON.parse(JSON.stringify(ri)); tasks++; return; }
    let conflict=false;
    if(sevOf(ri.status)>sevOf(li.status)){ if(li.status&&li.status!==ri.status)conflict=true; li.status=ri.status; }
    else if(ri.status&&li.status&&ri.status!==li.status)conflict=true;
    li.done=li.done||ri.done; li.initials=li.initials||ri.initials; li.by=li.by||ri.by; li.bySap=li.bySap||ri.bySap;
    li.notif=li.notif||ri.notif; li.disp=li.disp||ri.disp;
    if(ri.comment&&ri.comment!==li.comment)li.comment=li.comment?(li.comment+(li.comment.includes(ri.comment)?'':' | '+ri.comment)):ri.comment;
    li.vals=li.vals||{}; Object.keys(ri.vals||{}).forEach(f=>{ if((li.vals[f]??'')==='')li.vals[f]=ri.vals[f]; else if(ri.vals[f]!==''&&ri.vals[f]!==li.vals[f])conflict=true; });
    li.points=li.points||{}; Object.keys(ri.points||{}).forEach(p=>{ if(sevOf(ri.points[p])>sevOf(li.points[p])){ if(li.points[p]&&li.points[p]!==ri.points[p])conflict=true; li.points[p]=ri.points[p]; } else if(ri.points[p]&&li.points[p]&&ri.points[p]!==li.points[p])conflict=true; });
    li.grid=li.grid||{}; Object.keys(ri.grid||{}).forEach(rk=>{ li.grid[rk]=li.grid[rk]||{}; Object.keys(ri.grid[rk]||{}).forEach(ck=>{ if((li.grid[rk][ck]??'')==='')li.grid[rk][ck]=ri.grid[rk][ck]; else if(ri.grid[rk][ck]!==''&&ri.grid[rk][ck]!==li.grid[rk][ck])conflict=true; }); });
    if(conflict){ conflicts++; if(!/\[MERGE/.test(li.comment||''))li.comment=(li.comment||'')+' [MERGE: differing crew entries — review]'; }
    tasks++;
  });
  // addWork union by detail
  (inc.addWork||[]).forEach(w=>{ if(w.detail&&w.detail.trim()&&!state.addWork.some(x=>x.detail.trim()===w.detail.trim()))state.addWork.push(w); });
  // signatures union by name+sap
  ['maint','sup'].forEach(g=>{ (inc[g]||[]).forEach(p=>{ if(p.name&&!state[g].some(x=>x.name===p.name&&x.sap===p.sap))state[g].push(p); }); });
  // safety union
  if(inc.safety){ state.safety.swiSigned=state.safety.swiSigned||inc.safety.swiSigned;
    state.safety.takeControl=state.safety.takeControl||inc.safety.takeControl;
    state.safety.jhaRaised=state.safety.jhaRaised||inc.safety.jhaRaised;
    state.safety.ack=state.safety.ack||inc.safety.ack; }
  if(inc.comments&&inc.comments!==state.comments)state.comments=state.comments?(state.comments+'\n'+inc.comments):inc.comments;
  return {tasks,conflicts,addedCrew};
}
function exportMyPart(){
  const data=JSON.parse(JSON.stringify(state));
  const who=(config.operatorName||'me').replace(/\s+/g,'-');
  download((state.meta.wo||'WO')+'_'+who+'_part.json', JSON.stringify(data), 'application/json');
  toast('Your part exported — share it to the lead tablet to merge');
}
function importMergeFile(file){
  const rd=new FileReader();
  rd.onload=()=>{ let inc; try{ inc=JSON.parse(rd.result); }catch(e){ toast('Could not read that file'); return; }
    const res=mergeState(inc);
    if(res.error){ toast(res.error); return; }
    save(); render();
    toast(`Merged: ${res.tasks} tasks${res.addedCrew?', +'+res.addedCrew+' crew':''}${res.conflicts?' · '+res.conflicts+' conflict(s) flagged':''}`);
  };
  rd.readAsText(file);
}
let syncing=false, syncTimer=null, syncDebounce=null;
async function syncNow(){
  if(syncing||!config.syncUrl||!state.meta.wo) return;
  if(typeof navigator!=='undefined'&&navigator.onLine===false){ updateSyncBadge(); return; }
  syncing=true;
  try{
    const headers={'Content-Type':'application/json'}; if(config.apiKey)headers['x-api-key']=config.apiKey;
    const body={ type:'sync', wo:state.meta.wo, by:config.operatorName, bySap:config.operatorSap, state };
    const r=await fetch(config.syncUrl,{method:'POST',headers,body:JSON.stringify(body)});
    if(r.ok){ const remote=await r.json().catch(()=>null);
      if(remote&&remote.results){ const m=mergeState(remote); save();
        // re-render only if something changed materially
        if(m&&(m.tasks||m.addedCrew||m.conflicts))render(); }
      const s=$('#lastSync'); if(s)s.textContent='Last sync '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    }
  }catch(e){ /* offline; ignore, will retry */ }
  syncing=false; updateSyncBadge();
}
function scheduleSync(){ if(!config.live||!config.syncUrl)return; clearTimeout(syncDebounce); syncDebounce=setTimeout(syncNow,1500); }
function setLive(on){ config.live=on; saveConfig(); updateSyncBadge();
  clearInterval(syncTimer);
  if(on&&config.syncUrl){ syncNow(); syncTimer=setInterval(syncNow,10000); } }

    <div class="lg"><span class="k C">C</span><div>Defect found, <b>safe to operate</b>. Raise a notification.</div></div>
    <div class="lg"><span class="k N">N</span><div>Defect found; asset <b>NOT serviceable</b>. Tag out of service, raise notification, notify supervisor.</div></div>
    <div class="lg"><span class="k" style="background:var(--na-d);color:var(--steel)">N/A</span><div>Task not required at this interval / configuration.</div></div>
  </div>
  <p style="color:var(--mut);font-size:.84rem;margin-top:14px">Tap a status for each task. Measurement fields auto-flag when outside the printed spec. Comments are mandatory for B, C and N.</p></div>
  <div class="modal-f"><button class="btn primary" onclick="closeModal()">Got it</button></div>`);

$('#submitBtn').onclick=()=>{
  const issues=validate();
  const hasEp=!!config.endpoint;
  if(issues.length){
    openModal(`<div class="modal-h"><div class="ic" style="background:var(--n-d);color:var(--n)">!</div><h3>${issues.length} item${issues.length>1?'s':''} to resolve</h3></div>
      <div class="modal-b">${issues.slice(0,40).map(i=>`<div class="issue"><span class="jn">${esc(i.jn)}</span><span>${esc(i.txt)}</span></div>`).join('')}
      ${issues.length>40?`<p style="color:var(--mut)">…and ${issues.length-40} more.</p>`:''}</div>
      <div class="modal-f"><button class="btn ghost" onclick="closeModal()">Keep editing</button>
      <button class="btn primary" id="forceSub">Submit anyway</button></div>`);
    $('#forceSub').onclick=()=>{ closeModal(); hasEp?submitToFlow():doExport(); };
  } else {
    openModal(`<div class="modal-h"><div class="ic" style="background:var(--a-d);color:var(--a)">&#10003;</div><h3>Ready to submit</h3></div>
      <div class="modal-b"><div class="ok-banner">All required tasks complete and signed.</div>
      <p style="color:var(--mut);font-size:.88rem;margin-top:12px">${hasEp
        ? 'Sends the inspection straight to your configured flow &rarr; Power BI. One record per task / measurement.'
        : 'No flow URL set yet. You can download the Power BI&ndash;ready CSV + JSON, or set up direct submission.'}</p></div>
      <div class="modal-f">
      <button class="btn ghost" id="dlBtn">Download files</button>
      <button class="btn primary" id="mainAct">${hasEp?'Submit to flow':'Set up flow URL'}</button></div>`);
    $('#dlBtn').onclick=()=>{ closeModal(); doExport(); };
    $('#mainAct').onclick=()=>{ closeModal(); hasEp?submitToFlow():openSettings('Add your flow URL to submit directly.'); };
  }
};
$('#dumpBtn').onclick=()=>openSaveChooser();
$('#newBtn').onclick=()=>{
  openModal(`<div class="modal-h"><div class="ic" style="background:var(--c-d);color:var(--c)">&#10227;</div><h3>Start new inspection?</h3></div>
    <div class="modal-b"><p style="color:var(--steel)">This clears the current draft. Submit or export first if you need to keep it.</p></div>
    <div class="modal-f"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn primary" id="confNew">Clear &amp; start new</button></div>`);
  $('#confNew').onclick=async()=>{ closeModal(); startNew(); };
};

/* ===== boot ===== */
(async function(){ await loadConfig(); await loadOutbox(); await load(); render(); updateSyncBadge();
  if(config.live&&config.syncUrl)setLive(true);
  if(typeof window!=='undefined'){ window.addEventListener('online',()=>{ flushOutbox(); if(config.live)syncNow(); updateSyncBadge(); });
    window.addEventListener('offline',updateSyncBadge); }
})();

</script>
</body>
</html>
